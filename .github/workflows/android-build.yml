name: Android Build

on:
  push:
    branches: [main, claude/android-keyboard]
    paths:
      - "KeybondAndroid/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "KeybondAndroid/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KeybondAndroid
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keybond-debug-apk
          path: KeybondAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to ci-artifacts branch
        working-directory: /tmp
        run: |
          rm -rf apk-publish
          mkdir apk-publish
          cp "$GITHUB_WORKSPACE"/KeybondAndroid/app/build/outputs/apk/debug/*.apk apk-publish/keybond-debug.apk
          cd apk-publish
          git init -q
          git checkout -q -b ci-artifacts
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add keybond-debug.apk
          git commit -q -m "APK from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:ci-artifacts
